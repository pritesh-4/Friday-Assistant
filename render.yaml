services:
  - type: web
    name: friday-backend
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && (if [ \"$VOICE_ENABLED\" = \"true\" ]; then pip install -r requirements-voice.txt && python scripts/download_models.py; else echo 'Voice disabled, skipping voice dependencies and models'; fi)"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    # /health is the liveness probe — responds instantly, never queries DB.
    # DO NOT use /health/ready here — it queries SQLite and can fail during startup,
    # causing Render to boot-loop the service.
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_ENV
        value: production
      # Use /tmp for SQLite on Render's ephemeral filesystem.
      # NOTE: Data is lost on every redeploy. For persistent storage,
      # switch to a managed database (e.g., Render PostgreSQL).
      - key: DATABASE_URL
        value: sqlite:///tmp/friday/friday.db
      - key: VOICE_ENABLED
        value: false
      - key: KOKORO_MODEL_PATH
        value: /opt/render/project/src/backend/data/models/kokoro/kokoro-v0_19.onnx
      - key: KOKORO_VOICES_PATH
        value: /opt/render/project/src/backend/data/models/kokoro/voices.json
      - key: MODELS_DIR
        value: /opt/render/project/src/backend/data/models
